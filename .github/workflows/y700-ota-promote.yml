name: Promote accepted Y700 OTA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag with accepted OTA
        required: true
        type: string
      ota_filename:
        description: Exact OTA ZIP asset name
        required: true
        type: string
      ota_sha256:
        description: Accepted SHA256 with reviewed ota/acceptance record
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: y700-ota-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'FAN789/y700-lineageos24' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify accepted exact asset and prepare feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          OTA_FILENAME: ${{ inputs.ota_filename }}
          OTA_SHA256: ${{ inputs.ota_sha256 }}
        run: python3 ci/promote.py
      - name: Commit validated OTA list
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ota/asphalt.json ota/history
          git diff --cached --quiet && exit 0
          git commit -m 'ota: promote independently accepted Y700 release'
          git push origin HEAD:main
