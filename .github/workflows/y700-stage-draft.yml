name: Stage unpublished Y700 firmware
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact offline-validated local candidate identifier
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: y700-draft-transport
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'FAN789/y700-lineageos24' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, y700-private-builder]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Upload only validated firmware to an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: python3 ci/stage-draft.py
