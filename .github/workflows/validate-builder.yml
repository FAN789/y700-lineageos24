name: Y700 builder validation
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact locally built candidate to verify on a staging builder
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: y700-builder-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'FAN789/y700-lineageos24' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, y700-fnos-validation]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require native sandbox and pipeline safety
        run: |
          python3 ci/check-local.py
          python3 ci/check-sandbox.py --source /home/builder/y700-lineage24/source
      - name: Validate the exact retained candidate without rebuilding
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: bash ci/recheck.sh "$CANDIDATE_RUN"
      - name: Keep candidate promotion independent
        if: always()
        run: echo 'Staging-builder validation does not publish firmware, promote the OTA feed or access a device.' >> "$GITHUB_STEP_SUMMARY"
